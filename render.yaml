services:
  - type: web
    name: todo-api-deniskoba
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@9.15.9 --activate && pnpm install --frozen-lockfile && pnpm --filter @todo/api prisma:generate && pnpm --filter @todo/api build
    startCommand: pnpm --filter @todo/api prisma:deploy && pnpm --filter @todo/api start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        value: todo://
